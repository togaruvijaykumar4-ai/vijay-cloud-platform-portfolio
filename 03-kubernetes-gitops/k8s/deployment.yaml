apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-demo
  template:
    metadata:
      labels:
        app: cloud-demo
    spec:
      containers:
      - name: app
        image: ghcr.io/togaruvijaykumar4-ai/cloud-demo:latest
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-demo
spec:
  selector:
    app: cloud-demo
  ports:
  - port: 80
    targetPort: 8080
